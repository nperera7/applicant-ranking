[project]
name = "applicant-ranking"
version = "0.1.0"
description = "Advisory LLM ranking of Lever applications against per-role criteria (Egen Talent Acquisition)"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "charset-normalizer>=3.5",
    "fastapi>=0.115",
    "google-genai>=2.24,<3",
    "httpx>=0.28.1",
    "lxml>=6.1",
    "olefile>=0.47",
    "pdfminer-six>=20251230",
    "pillow>=12.3",
    "pydantic>=2.12",
    "pydantic-settings>=2.6",
    "pypdfium2>=5.14",
    "python-docx>=1.2",
    "pyyaml>=6.0.2",
    "rapidfuzz>=3.10",
    "striprtf>=0.0.33",
    "typer>=0.15",
    "uvicorn>=0.32",
]

[project.scripts]
applicant-ranking = "applicant_ranking.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/applicant_ranking"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
addopts = "-ra --import-mode=importlib"

[tool.ruff]
line-length = 100
target-version = "py313"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "S", "ASYNC", "RUF"]
ignore = ["S101"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S", "B011", "RUF001", "RUF002", "RUF003"]
# These modules deal with invisible/homoglyph characters by design.
"src/applicant_ranking/resumes/normalize.py" = ["RUF001", "RUF002", "RUF003"]
"src/applicant_ranking/resumes/security.py" = ["RUF001", "RUF002", "RUF003"]
"src/applicant_ranking/resumes/redact.py" = ["RUF001", "RUF002", "RUF003"]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.25",
    "reportlab>=4.2",
    "respx>=0.22",
    "ruff>=0.8",
]
