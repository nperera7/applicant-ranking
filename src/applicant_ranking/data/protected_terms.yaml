# Protected characteristics and proxies: the Applicant Ranking lexicon.
#
# OWNERSHIP: Egen Legal and HR own this list. Engineering drafted it from the
# anti-discrimination laws that apply (federal Title VII, ADEA, ADA, GINA, PDA/PWFA, USERRA and IRCA;
# the Illinois Human Rights Act, including HB 3773's ban on zip codes as a proxy; the
# NYC Human Rights Law, including height/weight, caregiver status, unemployment status
# and arrest/conviction records; California FEHA; Colorado). It is NOT legal advice and
# must not change without Legal/HR review. Record each review under `metadata` below.
#
# HOW IT IS USED
# 1. Criteria linting: any hit in a role's title, summary, requirement or knockout
#    descriptions, or guardrails is an error, so the criteria cannot be used in any
#    mode until it is rewritten.
# 2. Model output validation: strengths, gaps, red-flag details, the summary and the
#    per-requirement notes are scanned. On a hit the model is asked once to rewrite
#    (the request names the category and the model's own words that hit it). If the
#    rewrite still hits, the evaluation goes to human review and none of the model's
#    text is written back to Lever. Evidence quotes copied from the resume are not
#    scanned; a fuzzily matched quote whose model wording adds a term the resume span
#    lacks is discarded as ungrounded.
#
# MATCHING RULES (see applicant_ranking/scoring/lexicon.py)
# - Case-insensitive, whole words or phrases. Inside a phrase, a space also matches
#   any run of spaces or hyphens: "able bodied" matches "able-bodied".
# - Entries starting with `re:` are Python regular expressions, matched as written
#   (case-insensitive; write \b for word boundaries). Quote them with single quotes.
# - `allow_phrases` are blanked out before scanning, so "React Native", "white paper"
#   or "race condition" never count as hits. Add an allow phrase for a technical or
#   business phrase that would otherwise trigger a false positive. Never add one that
#   could describe a person.
#
# EDITING GUIDANCE
# - Prefer specific phrases over bare words that have a common technical meaning:
#   "years old", "too old" and "older workers" instead of "old"; "single mother" and
#   "marital status" instead of "single"; "visa sponsorship" instead of "sponsor"
#   (which also means a project sponsor). Bare words that are kept even though they
#   have rare technical uses ("he", "his", "veteran", "young", "black", "white") are
#   kept on purpose: the model must say "the candidate", and a false positive costs
#   only one corrective retry or one human review.
# - Statements ABOUT the candidate that use everyday words ("the candidate seems older",
#   "is Indian", "is blind", "over 50") are caught by person-context regexes: a subject
#   (candidate, applicant, he, she, they) plus a predicate verb, or a number with no
#   following noun. Bare "older", "blind" or "indian" stay unlisted because they have
#   ordinary technical or domain uses ("older Java services", "blind SQL injection").
# - Domain vocabulary that cannot describe a person (an employer such as "Department of
#   Veterans Affairs", a dataset such as "census tract data", a product such as
#   "FMLA case" tracking) goes in allow_phrases, so healthcare, fintech, HR-tech and
#   public-sector roles can state their domain and candidates from those employers are
#   not sent to review for every strength the model writes.
# - Every required category must stay present with at least one entry, or the service
#   refuses to start. Extra categories are allowed (appearance, criminal_record,
#   financial_history and other_status below cover protections in IL, NYC and CA).
# - After editing, run `uv run pytest tests/scoring -q`. It includes a false-positive
#   test over ordinary technical resume sentences and a true-positive test per category.

